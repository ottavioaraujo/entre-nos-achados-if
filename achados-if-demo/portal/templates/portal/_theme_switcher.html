<label class="theme-picker"><span>Tema</span><select id="siteThemeChoice" aria-label="Escolher tema visual"><option value="current">Atual</option><option value="suap">SUAP</option></select></label>
<script>
(() => {
  const picker = document.getElementById("siteThemeChoice");
  if (!picker) return;
  let savedTheme = "current";
  try { savedTheme = localStorage.getItem("entre-nos-theme") || "current"; } catch (_error) {}
  const applyTheme = (theme, save = false) => {
    const selected = theme === "suap" ? "suap" : "current";
    if (selected === "suap") document.documentElement.dataset.theme = "suap";
    else delete document.documentElement.dataset.theme;
    picker.value = selected;
    if (save) {
      try { localStorage.setItem("entre-nos-theme", selected); } catch (_error) {}
    }
  };
  applyTheme(savedTheme);
  picker.addEventListener("change", () => applyTheme(picker.value, true));
})();
</script>
